<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The BiPolar Times</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cinzel@5/700.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif@5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif@5/700.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5/500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans@5/700.css">
  <style>
    :root { --paper:#F5F0E5; --ink:#1E1B16; --muted:#7A7060; --line:#C8C2B0; }
    * { box-sizing:border-box; }
    body { margin:0; background:#e7ddca; color:var(--ink); font-family:'IBM Plex Sans', sans-serif; }
    .page { max-width:1120px; margin:24px auto; padding:24px 28px 48px; background:var(--paper); border:1px solid rgba(30,27,22,.12); box-shadow:0 18px 50px rgba(30,27,22,.12); }
    .rule-thick { height:5px; background:var(--ink); margin-bottom:3px; }
    .rule-thin { height:1px; background:var(--ink); margin-bottom:16px; }
    .topline { display:flex; justify-content:space-between; gap:16px; font:500 10px/1.4 'Noto Serif', serif; letter-spacing:.12em; color:var(--muted); text-transform:uppercase; }
    .masthead { text-align:center; margin:10px 0 6px; font-family:'Felix Titling','Cinzel',serif; font-weight:700; letter-spacing:.035em; text-transform:uppercase; font-size:clamp(34px,7vw,76px); line-height:.95; }
    .slogan { text-align:center; font:italic 14px/1.4 'Noto Serif',serif; letter-spacing:.08em; margin:10px 0 4px; }
    .subtitle { text-align:center; font:italic 10.5px/1.4 'Noto Serif',serif; letter-spacing:.11em; color:var(--muted); margin:0 0 16px; }
    .nav { display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:12px; border-top:1px solid var(--ink); border-bottom:1px solid var(--line); padding:14px 0; margin:16px 0 24px; }
    .nav button { min-width:190px; border:1.5px solid var(--ink); background:rgba(255,255,255,.28); padding:12px 18px; font:700 12px/1 'Noto Serif',serif; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; box-shadow:inset 0 -1px 0 rgba(30,27,22,.18); transition:background .15s,color .15s,transform .15s,box-shadow .15s; }
    .nav button:hover { background:rgba(30,27,22,.08); transform:translateY(-1px); box-shadow:0 2px 0 rgba(30,27,22,.18); }
    .nav button.active { background:var(--ink); color:var(--paper); box-shadow:0 3px 0 rgba(30,27,22,.22); }
    .section-head { display:flex; justify-content:space-between; gap:18px; align-items:flex-end; border-bottom:2px solid var(--ink); padding-bottom:10px; margin-bottom:22px; }
    .section-title { font:700 20px/1.1 'Noto Serif',serif; letter-spacing:.11em; text-transform:uppercase; }
    .timestamp { font:400 11px/1.5 'Noto Serif',serif; color:var(--muted); margin-top:6px; }
    .ticker { text-align:right; max-width:520px; font:400 10.5px/1.5 'Noto Serif',serif; color:var(--muted); }
    .lead { border-bottom:1px solid var(--line); padding-bottom:24px; margin-bottom:24px; }
    .badge-row { display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
    .badge { display:inline-block; color:white; background:#424242; padding:4px 8px; font:700 9px/1 'Noto Serif',serif; letter-spacing:.13em; text-transform:uppercase; }
    .sentiment { margin-left:auto; font:700 9px/1 'Noto Serif',serif; letter-spacing:.12em; border-left:3px solid currentColor; padding-left:6px; text-transform:uppercase; }
    h2,h3 { font-family:'IBM Plex Sans', sans-serif; color:var(--ink); margin:0; }
    h2 { font-size:clamp(28px,4vw,46px); line-height:1.05; letter-spacing:-.03em; margin-bottom:12px; }
    h3 { font-size:22px; line-height:1.15; letter-spacing:-.018em; margin-bottom:8px; }
    p { font:400 14px/1.75 'IBM Plex Sans', sans-serif; margin:0; color:#2E2B22; }
    .meta { margin-top:12px; padding-top:10px; border-top:.5px solid var(--line); font:italic 11px/1.4 'Noto Serif',serif; color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:28px 34px; }
    .card { border-top:2px solid var(--ink); padding-top:14px; }
    .footer { margin-top:34px; border-top:1px solid var(--line); padding-top:12px; text-align:center; font:italic 11px/1.4 'Noto Serif',serif; color:var(--muted); }
    .error { padding:24px; border:1px solid #B71C1C; color:#B71C1C; background:#fff; }
    @media (max-width:700px) { .page { margin:0; padding:18px; } .section-head { display:block; } .ticker { text-align:left; margin-top:8px; } .sentiment { margin-left:0; } }
  </style>
</head>
<body>
  
  <main class="page">
    <div class="rule-thick"></div><div class="rule-thin"></div>
    <div class="topline"><span id="dateLine">Bangkok Time</span><span id="exportLine"></span></div>
    <h1 class="masthead">The BiPolar Times</h1>
    <div class="slogan">The Newspaper That Connects The Markets Of Both Worlds</div>
    <p class="subtitle">AI-Powered Financial Intelligence · Read-Only Market Snapshot</p>
    <nav class="nav" id="nav"></nav>
    <section id="content"></section>
    <div class="footer" id="footer"></div>
  </main>
  <script>
    const colors = {Technology:'#1A4B8C',Finance:'#5C3317',Energy:'#8B4513',Healthcare:'#1B5E20',Consumer:'#880E4F',Industrial:'#37474F',Materials:'#2E7D32','Real Estate':'#B71C1C',Utilities:'#006064',Communications:'#0D47A1',Gold:'#9C7A00','Precious Metals':'#7D6608','Base Metals':'#6E6E6E',Agriculture:'#5D8A3A','Bulk Commodities':'#6D4C41',Other:'#424242'};
    const sentimentColor = {positive:'#2E7D32', negative:'#B71C1C', neutral:'#546E7A'};
    const order = ['us','asia','commodities'];
    const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    function fmt(iso, seconds=false) {
      if (!iso) return '';
      const d = new Date(iso); if (Number.isNaN(d.getTime())) return '';
      return new Intl.DateTimeFormat('en-US', {timeZone:'Asia/Bangkok', month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit', ...(seconds?{second:'2-digit'}:{}), hour12:false}).format(d) + ' Bangkok';
    }
    function storyCard(item, lead=false) {
      const sector = item.sector || 'Other';
      const s = item.sentiment || 'neutral';
      const badgeColor = colors[sector] || colors.Other;
      return `<article class="${lead?'lead':'card'}">
        <div class="badge-row"><span class="badge" style="background:${badgeColor}">${esc(sector)}</span>${item.magnitude==='high'?'<span class="badge" style="background:#B71C1C">Breaking</span>':''}<span class="sentiment" style="color:${sentimentColor[s]||sentimentColor.neutral}">${esc(s)}${item.magnitude==='high'?' ●':''}</span></div>
        ${lead?`<h2>${esc(item.headline)}</h2>`:`<h3>${esc(item.headline)}</h3>`}
        <p>${esc(item.body)}</p>
        <div class="meta">${item.source?'Source: '+esc(item.source):''}${item.publishedAtISO?' · '+esc(fmt(item.publishedAtISO)):''}</div>
      </article>`;
    }
    function renderSection(data, id) {
      const sec = data.sections?.[id];
      if (!sec) return;
      document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.id===id));
      const news = [...(sec.news||[])].sort((a,b)=>new Date(b.publishedAtISO||0)-new Date(a.publishedAtISO||0));
      const [lead, ...rest] = news;
      document.getElementById('content').innerHTML = `<div class="section-head"><div><div class="section-title">${esc(sec.label)}</div><div class="timestamp">Last refreshed ${esc(fmt(sec.lastUpdated,true))} · ${news.length} stories</div></div><div class="ticker">${esc(sec.ticker)}</div></div>${lead?storyCard(lead,true):'<p>No stories in this section.</p>'}${rest.length?`<div class="grid">${rest.map(x=>storyCard(x,false)).join('')}</div>`:''}`;
    }
    async function renderArchive() {
      document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.id === 'archive'));
      try {
        const res = await fetch('snapshots/index.json', {cache: 'no-store'});
        if (!res.ok) throw new Error('snapshots/index.json not found');
        const index = await res.json();
        const files = Array.isArray(index.files) ? index.files : [];

        const editions = files
          .map(file => {
            const match = file.match(/(\d{4}-\d{2}-\d{2})/);
            const date = match ? match[1] : '';
            const title = date
              ? new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'Asia/Bangkok' }).format(new Date(date + 'T00:00:00+07:00')) + ' Edition'
              : file.replace(/\.json$/i, '');
            return {
              file: file.startsWith('snapshots/') ? file : `snapshots/${file}`,
              date,
              title
            };
          })
          .sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

        document.getElementById('content').innerHTML = `
          <div class="section-head">
            <div>
              <div class="section-title">Previous Editions</div>
              <div class="timestamp">Latest editions first · ${editions.length} archived edition${editions.length === 1 ? '' : 's'}</div>
            </div>
            <div class="ticker">The BiPolar Times Archive</div>
          </div>
          <div class="grid">
            ${editions.map(ed => `
              <article class="card">
                <h3>
                  <a href="edition.html?file=${encodeURIComponent(ed.file)}" style="color:#1E1B16;text-decoration:none;border-bottom:1px solid transparent">
                    ${esc(ed.title)}
                  </a>
                </h3>
                <p>Read this archived market snapshot.</p>
                <div class="meta">${esc(ed.date)}</div>
              </article>
            `).join('')}
          </div>`;
      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="error">Could not load <strong>snapshots/index.json</strong>. Make sure it is inside the snapshots folder.</div>`;
        console.error(err);
      }
    }

    fetch('snapshot.json', {cache: 'no-store'}).then(r => { if(!r.ok) throw new Error('snapshot.json not found'); return r.json(); }).then(data => {
      document.getElementById('dateLine').textContent = new Intl.DateTimeFormat('en-US', {timeZone:'Asia/Bangkok', weekday:'long', year:'numeric', month:'long', day:'numeric'}).format(new Date(data.exportedAt || Date.now()));
      document.getElementById('exportLine').textContent = '';
      document.querySelector('.slogan').textContent = data.slogan || 'The Newspaper That Connects The Markets Of Both Worlds';
      const nav = document.getElementById('nav');
      order.filter(id=>data.sections?.[id]).forEach(id => {
        const btn = document.createElement('button');
        btn.dataset.id = id;
        btn.textContent = data.sections[id].label;
        btn.onclick = () => renderSection(data, id);
        nav.appendChild(btn);
      });

      const archiveBtn = document.createElement('button');
      archiveBtn.dataset.id = 'archive';
      archiveBtn.textContent = 'PREVIOUS EDITIONS';
      archiveBtn.onclick = () => renderArchive();
      nav.appendChild(archiveBtn);

      renderSection(data, order.find(id=>data.sections?.[id]) || Object.keys(data.sections||{})[0]);
      document.getElementById('footer').textContent = `${data.publication || 'The BiPolar Times'} · ${data.timezone || 'Asia/Bangkok'} · Read-only snapshot`;
    }).catch(err => {
      document.getElementById('content').innerHTML = `<div class="error">Could not load snapshot data. Put <strong>snapshot.json</strong> in the same folder as this file, or use the standalone HTML version.</div>`;
      console.error(err);
    });
  </script>
</body>
</html>
